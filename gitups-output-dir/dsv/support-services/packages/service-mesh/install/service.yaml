apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app.kubernetes.io/name: service-mesh
    app.kubernetes.io/part-of: support-services
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-mesh
  ports:
    - name: grpc-xds
      port: 15010
      targetPort: grpc-xds
    - name: https-dns
      port: 15012
      targetPort: https-dns
    - name: http-monitoring
      port: 15014
      targetPort: http-monitoring

