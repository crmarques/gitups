apiVersion: apps/v1
kind: Deployment
metadata:
  name: declarest
  namespace: declarest-system
  labels:
    app.kubernetes.io/name: declarest
    app.kubernetes.io/part-of: gitops-controllers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: declarest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: declarest
        app.kubernetes.io/part-of: gitops-controllers
    spec:
      serviceAccountName: declarest
      containers:
        - name: declarest
          image: ghcr.io/crmarques/declarest:v0.3.8
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - --config=/etc/declarest/config.yaml
          ports:
            - name: metrics
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/declarest
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: declarest-bootstrap
            optional: true
