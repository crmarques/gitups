apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app.kubernetes.io/name: service-mesh
    app.kubernetes.io/part-of: support-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-mesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-mesh
        app.kubernetes.io/part-of: support-services
    spec:
      serviceAccountName: istiod
      containers:
        - name: discovery
          image: docker.io/istio/pilot:1.23.2
          imagePullPolicy: IfNotPresent
          args:
            - discovery
            - --monitoringAddr=:15014
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: grpc-xds
              containerPort: 15010
            - name: https-dns
              containerPort: 15012
            - name: http-monitoring
              containerPort: 15014

