apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: basic-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://gitea.dsv.local/gitops/basic-infra.git"
    path: "."
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
