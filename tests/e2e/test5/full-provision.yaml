  placeholders: null
  repositories:
  - description: OLM + metallb + nginx-ingress (internal, behind haproxy).
    name: basic-infra
    type: kubernetes-resources
  - description: haproxy (LoadBalancer entrypoint) + gitea (internal).
    name: support-services
    type: kubernetes-resources
  - description: argocd (KRC) + declarest (SRC).
    name: controllers
    type: kubernetes-resources
  - description: 'dev overlay: metallb → nginx-ingress binding materialises the metallb
      IPAddressPool. haproxy''s Service type=LoadBalancer (in support-services) picks
      up an IP from that pool automatically.'
    name: basic-infra-dev
    repoRef:
      name: basic-infra
    type: kubernetes-resources
  - description: dev overlay for support-services (no overrides needed — defaults
      from the generic repo suffice).
    name: support-services-dev
    repoRef:
      name: support-services
    type: kubernetes-resources
  - description: Argocd instance (default) + declarest CRs — per-service ResourceRepository/ManagedService/SyncPolicy
      trios for gitea and haproxy.
    name: controllers-dev
    repoRef:
      name: controllers
    type: kubernetes-resources
  - description: 'Declarest payloads for gitea: orgs, repos, users, permissions.'
    managedServiceRef:
      instance: gitea
      repo: controllers-dev
    name: gitea-dsv
    type: service-resources
  - description: 'Declarest payloads for haproxy: backends, frontends, acls.'
    managedServiceRef:
      instance: haproxy
      repo: controllers-dev
    name: haproxy-dsv
    type: service-resources
  repository:
    layout: split
    outputPath: ./out/test5
  sourceProvisionRef:
    name: test5
  sources:
  - name: local
    path: ../../../../gitups-packages/packages
    type: filesystem
