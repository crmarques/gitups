apiVersion: declarest.io/v1alpha1
kind: SyncPolicy
metadata:
  name: gitea
  namespace: declarest-system
spec:
  resourceRepositoryRef:
    name: gitea
  managedServiceRef:
    name: gitea
  secretStoreRef:
    name: local
  source:
    path: /
    recursive: true
  sync:
    force: false
    prune: false
  syncInterval: 5m
  suspend: false
