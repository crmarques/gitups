apiVersion: declarest.io/v1alpha1
kind: SecretStore
metadata:
  name: local
  namespace: declarest-system
spec:
  file:
    path: /var/lib/declarest/secrets/secrets.json
    encryption:
      passphraseRef:
        name: 
        key: passphrase
    storage:
      pvc:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 1Gi
