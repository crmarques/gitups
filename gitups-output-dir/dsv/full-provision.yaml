        version: 0.15.3
      namespace: metallb-system
    role: workload
    template: local/metallb
    unitType: install
  - applyWave: 1
    dependsOn:
    - metallb/install
    domain: install
    installMethod: helm
    instance: nginx-ingress
    packageInstance: nginx-ingress
    renderedPaths:
      dir: packages/nginx-ingress/install/helm
      repo: basic-infra
    renderer: helm
    repository: basic-infra
    resolvedValues:
      appVersion: 1.15.1
      chart:
        version: 4.15.1
      controller:
        ingressClassResource:
          default: true
          name: nginx
        service:
          type: LoadBalancer
      namespace: ingress-nginx
    role: workload
    template: local/nginx-ingress
    unitType: install
  - applyWave: 1
    dependsOn:
    - metallb/install
    domain: resources
    instance: metallb-config-default
    packageInstance: metallb
    renderedPaths:
      dir: packages/metallb/resources/config/default
      repo: basic-infra-dsv
    renderer: raw
    repository: basic-infra-dsv
    resolvedValues:
      addressPools:
      - cidrs:
        - 172.18.255.200-172.18.255.250
        name: default
      namespace: metallb-system
    resourceName: default
    resourceTemplate: config
    role: workload
    template: local/metallb
    unitType: resource
  - applyWave: 0
    domain: install
    installMethod: helm
    instance: vault
    packageInstance: vault
    renderedPaths:
      dir: packages/vault/install/helm
      repo: support-services
    renderer: helm
    repository: support-services
    resolvedValues:
      appVersion: 1.21.2
      chart:
        version: 0.32.0
      injector:
        enabled: false
      namespace: vault
      server:
        dev:
          devRootToken: gitups-e2e-root
          enabled: true
        ha:
          enabled: false
        standalone:
          enabled: false
      ui:
        enabled: true
    role: workload
    template: local/vault
    unitType: install
  - applyWave: 0
    domain: install
    installMethod: helm
    instance: gitea
    packageInstance: gitea
    renderedPaths:
      dir: packages/gitea/install/helm
      repo: support-services
    renderer: helm
    repository: support-services
    resolvedValues:
      appVersion: 1.25.5
      chart:
        version: 12.5.3
      namespace: gitea
      persistence:
        enabled: false
      postgresql:
        enabled: false
      postgresql-ha:
        enabled: false
      redis-cluster:
        enabled: false
      rootURL: http://gitea.gitea.svc.cluster.local:3000/
    role: workload
    template: local/gitea
    unitType: install
