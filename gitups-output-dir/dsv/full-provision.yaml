  repositories:
  - description: Cluster-wide infra installed up-front.
    name: basic-infra
    type: kubernetes-resources
  - description: Env-specific infra config.
    name: basic-infra-dsv
    repoRef:
      commit: v0.0.1
      name: basic-infra
    type: kubernetes-resources
