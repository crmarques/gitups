    name: support-services
    type: kubernetes-resources
  - description: Env-specific support service configuration.
    name: support-services-dsv
    repoRef:
      commit: v0.0.1
      name: support-services
    type: kubernetes-resources
  - description: Cluster-wide GitOps controller configuration.
    name: gitops-controllers
