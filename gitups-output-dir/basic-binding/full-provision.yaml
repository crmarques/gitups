apiVersion: gitups/v1alpha1
kind: FullProvision
metadata:
  name: basic-binding
spec:
  packages:
  - applyWave: 0
    domain: install
    installMethod: raw
    instance: olm
    packageInstance: olm
    renderedPaths:
      dir: packages/olm/install/raw
      repo: basic-infra
    renderer: raw
    repository: basic-infra
    resolvedValues:
      catalog:
        image:
          digest: 9fbfd70da2cedae8754fb8ed1b4d9c55733b5a7e06685d34aa415063cd964743
          repository: quay.io/operatorhubio/catalog
      images:
        configmapOperatorRegistry:
          digest: 3e259e1e339ad9d388cb611745312ae1c0390c9338bfd6d9965811e1978d9d1c
          repository: quay.io/operator-framework/configmap-operator-registry
        olm:
          digest: 36563571fdddf266ab871efcec0fbd98d3b74bff14506718aa79f9853712d640
          repository: quay.io/operator-framework/olm
        opm:
          digest: f778630c62ee19b0aeda9969c2488de88ce84d5b1d040c97a33f9f38832bab14
          repository: quay.io/operator-framework/opm
      namespace: olm
      podSecurity:
        version: v1.35
      release: v0.42.0
    role: workload
    template: local/olm
    unitType: install
  - applyWave: 0
    domain: install
    installMethod: helm
    instance: metallb
    packageInstance: metallb
    renderedPaths:
      dir: packages/metallb/install/helm
      repo: basic-infra
    renderer: helm
    repository: basic-infra
    resolvedValues:
      appVersion: v0.15.3
      chart:
        version: 0.15.3
      namespace: metallb-system
    role: workload
    template: local/metallb
    unitType: install
  - applyWave: 1
    dependsOn:
    - metallb/install
    domain: install
    installMethod: helm
    instance: nginx-ingress
    packageInstance: nginx-ingress
    renderedPaths:
      dir: packages/nginx-ingress/install/helm
      repo: basic-infra
    renderer: helm
    repository: basic-infra
    resolvedValues:
      appVersion: 1.15.1
      chart:
        version: 4.15.1
      controller:
        ingressClassResource:
          default: true
          name: nginx
        service:
          type: LoadBalancer
      namespace: ingress-nginx
    role: workload
    template: local/nginx-ingress
    unitType: install
  - applyWave: 1
    dependsOn:
    - metallb/install
    domain: resources
    instance: metallb-config-default
    packageInstance: metallb
    renderedPaths:
      dir: packages/metallb/resources/config/default
      repo: basic-infra-dev
    renderer: raw
    repository: basic-infra-dev
    resolvedValues:
      addressPools:
      - cidrs:
        - 172.18.255.200-172.18.255.250
        name: default
      namespace: metallb-system
    resourceName: default
    resourceTemplate: config
    role: workload
    template: local/metallb
    unitType: resource
  - applyWave: 0
    domain: install
    installMethod: helm
    instance: gitea
    packageInstance: gitea
    renderedPaths:
      dir: packages/gitea/install/helm
      repo: support-services
    renderer: helm
    repository: support-services
    resolvedValues:
      appVersion: 1.25.5
      chart:
        version: 12.5.3
      namespace: gitea
      persistence:
        enabled: false
      postgresql:
        enabled: false
      postgresql-ha:
        enabled: false
      redis-cluster:
        enabled: false
      rootURL: http://gitea.gitea.svc.cluster.local:3000/
    role: workload
    template: local/gitea
    unitType: install
  - applyWave: 1
    dependsOn:
    - gitea/install
    domain: resources
    instance: gitea-config-default
    packageInstance: gitea
    renderedPaths:
      dir: packages/gitea/resources/config/default
      repo: support-services-dev
    renderer: raw
    repository: support-services-dev
    resolvedValues:
      namespace: gitea
      rootURL: http://gitea.gitea.svc.cluster.local:3000/
    resourceName: default
    resourceTemplate: config
    role: workload
    template: local/gitea
    unitType: resource
  - applyWave: 0
    domain: install
    installMethod: helm
    instance: argocd
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/install/helm
      repo: gitops-controllers
    renderer: helm
    repository: gitops-controllers
    resolvedValues:
      appVersion: v3.3.7
      chart:
        version: 9.5.2
      namespace: argocd
      server:
        ingress:
          enabled: false
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: install
  - applyWave: 0
    domain: install
    installMethod: raw
    instance: declarest
    packageInstance: declarest
    renderedPaths:
      dir: packages/declarest/install/raw
      repo: gitops-controllers
    renderer: raw
    repository: gitops-controllers
    resolvedValues:
      image:
        repository: ghcr.io/crmarques/declarest
        tag: v0.3.8
      namespace: declarest-system
      replicas: 1
    role: service-resource-controller
    template: local/declarest
    unitType: install
  - applyWave: 1
    dependsOn:
    - argocd/install
    domain: resources
    instance: argocd-instance-default
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/resources/instance/default
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      instance: argocd
      namespace: argocd
    resourceName: default
    resourceTemplate: instance
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  - applyWave: 2
    binding:
      capability: git-provider
      name: argocd-gitea-bot
      side: consumer
    dependsOn:
    - argocd/install
    - gitea/resources/user/argocd-gitea-bot-support-services-dev
    domain: resources
    instance: argocd-repo-secret-argocd-gitea-bot-support-services-dev
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/resources/repo-secret/argocd-gitea-bot-support-services-dev
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      namespace: argocd
      repoPassword: e2e-argocd-bot-token
      repoURL: http://gitea.gitea.svc.cluster.local:3000/
      repoUsername: argocd-bot
    resourceName: argocd-gitea-bot-support-services-dev
    resourceTemplate: repo-secret
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  - applyWave: 1
    binding:
      capability: git-provider
      name: argocd-gitea-bot
      side: provider
    controller:
      instance: declarest
      intent: managed-script
      kind: service-resource-controller
      template: local/declarest
    dependsOn:
    - gitea/install
    domain: resources
    instance: gitea-user-argocd-gitea-bot-support-services-dev
    packageInstance: gitea
    renderedPaths:
      dir: packages/gitea/resources/user/argocd-gitea-bot-support-services-dev
      repo: support-services-dev
    renderer: raw
    repository: support-services-dev
    resolvedValues:
      namespace: gitea
      token: e2e-argocd-bot-token
      url: http://gitea.gitea.svc.cluster.local:3000/
      username: argocd-bot
    resourceName: argocd-gitea-bot-support-services-dev
    resourceTemplate: user
    role: workload
    template: local/gitea
    unitType: resource
  - applyWave: 2
    controller:
      instance: argocd
      intent: managed-repo
      kind: kubernetes-resource-controller
      template: local/argocd
    dependsOn:
    - argocd/resources/instance
    domain: kubernetes-resource-controller
    instance: argocd-managed-repo-basic-infra
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/kubernetes-resource-controller/managed-repo/basic-infra
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      destinationNamespace: argocd
      namespace: argocd
      path: .
      repoURL: https://example.invalid/gitops/basic-infra.git
      targetRevision: HEAD
    resourceName: basic-infra
    resourceTemplate: managed-repo
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  - applyWave: 2
    controller:
      instance: argocd
      intent: managed-repo
      kind: kubernetes-resource-controller
      template: local/argocd
    dependsOn:
    - argocd/resources/instance
    domain: kubernetes-resource-controller
    instance: argocd-managed-repo-basic-infra-dev
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/kubernetes-resource-controller/managed-repo/basic-infra-dev
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      destinationNamespace: argocd
      namespace: argocd
      path: .
      repoURL: https://example.invalid/gitops/basic-infra-dev.git
      targetRevision: HEAD
    resourceName: basic-infra-dev
    resourceTemplate: managed-repo
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  - applyWave: 2
    controller:
      instance: argocd
      intent: managed-repo
      kind: kubernetes-resource-controller
      template: local/argocd
    dependsOn:
    - argocd/resources/instance
    domain: kubernetes-resource-controller
    instance: argocd-managed-repo-support-services
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/kubernetes-resource-controller/managed-repo/support-services
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      destinationNamespace: argocd
      namespace: argocd
      path: .
      repoURL: https://example.invalid/gitops/support-services.git
      targetRevision: HEAD
    resourceName: support-services
    resourceTemplate: managed-repo
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  - applyWave: 2
    controller:
      instance: argocd
      intent: managed-repo
      kind: kubernetes-resource-controller
      template: local/argocd
    dependsOn:
    - argocd/resources/instance
    domain: kubernetes-resource-controller
    instance: argocd-managed-repo-support-services-dev
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/kubernetes-resource-controller/managed-repo/support-services-dev
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      destinationNamespace: argocd
      namespace: argocd
      path: .
      repoURL: https://example.invalid/gitops/support-services-dev.git
      targetRevision: HEAD
    resourceName: support-services-dev
    resourceTemplate: managed-repo
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  - applyWave: 2
    controller:
      instance: argocd
      intent: managed-repo
      kind: kubernetes-resource-controller
      template: local/argocd
    dependsOn:
    - argocd/resources/instance
    domain: kubernetes-resource-controller
    instance: argocd-managed-repo-gitops-controllers-dev
    packageInstance: argocd
    renderedPaths:
      dir: packages/argocd/kubernetes-resource-controller/managed-repo/gitops-controllers-dev
      repo: gitops-controllers-dev
    renderer: raw
    repository: gitops-controllers-dev
    resolvedValues:
      destinationNamespace: argocd
      namespace: argocd
      path: .
      repoURL: https://example.invalid/gitops/gitops-controllers-dev.git
      targetRevision: HEAD
    resourceName: gitops-controllers-dev
    resourceTemplate: managed-repo
    role: kubernetes-resource-controller
    template: local/argocd
    unitType: resource
  placeholders: null
  repositories:
  - name: basic-infra
    type: kubernetes-resources
  - name: basic-infra-dev
    repoRef:
      name: basic-infra
    type: kubernetes-resources
  - name: support-services
    type: kubernetes-resources
  - name: support-services-dev
    repoRef:
      name: support-services
    type: kubernetes-resources
  - name: gitops-controllers
    type: kubernetes-resources
  - name: gitops-controllers-dev
    repoRef:
      name: gitops-controllers
    type: kubernetes-resources
  repository:
    layout: split
    outputPath: ./out/basic-binding
  sourceProvisionRef:
    name: basic-binding
  sources:
  - name: local
    path: ../../../gitups-packages
    type: filesystem
