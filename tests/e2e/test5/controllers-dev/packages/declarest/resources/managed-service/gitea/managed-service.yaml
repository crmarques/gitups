apiVersion: declarest.io/v1alpha1
kind: ManagedService
metadata:
  name: gitea
  namespace: declarest-system
spec:
  http:
    baseURL: http://gitea-http.gitea.svc.cluster.local:3000
    auth:
      customHeaders:
        - header: Authorization
          prefix: token
          valueRef:
            name: gitea-admin-token
            key: token
  metadata:
    bundle: gitea:0.0.1
