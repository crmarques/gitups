apiVersion: gitups/v1alpha1
kind: Provision
metadata:
  name: basic-binding
spec:
  envKey: dev
  controllers:
    kubernetesResources:
      repo: gitops-controllers
      instance: argocd
    serviceResources:
      repo: gitops-controllers
      instance: declarest
  sources:
    - name: local
      type: filesystem
      path: ../../../gitups-packages

  repositories:
    - name: basic-infra
      type: kubernetes-resources
      packages:
        - template: local/olm
        - template: local/nginx-ingress
        - template: local/metallb
          installMethod: helm

    - name: basic-infra-{{.Env}}
      type: kubernetes-resources
      repoRef:
        name: basic-infra

    - name: support-services
      type: kubernetes-resources
      packages:
        - template: local/gitea

    - name: support-services-{{.Env}}
      type: kubernetes-resources
      repoRef:
        name: support-services

    - name: gitops-controllers
      type: kubernetes-resources
      packages:
        - template: local/argocd
          installMethod: helm
        - template: local/declarest

    - name: gitops-controllers-{{.Env}}
      type: kubernetes-resources
      repoRef:
        name: gitops-controllers
      packages:
        - template: local/argocd
          bindings:
            - name: argocd-gitea-bot
              capability: git-provider
              provider:
                repo: support-services
                instance: gitea
              values:
                username: argocd-bot
